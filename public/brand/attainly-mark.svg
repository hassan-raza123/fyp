<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Attainly">
  <!--
    Attainly mark.

    An "A" whose crossbar is the attainment threshold — it runs past both legs,
    so it reads as a measurement line rather than a letterform detail, and the
    apex rises through it. That is the product in one shape: a value measured
    against a target it has cleared.

    Constraints it is drawn to: no gradients, no thin strokes and no text, so it
    survives a 16px favicon; a single flat indigo so it prints and inverts
    cleanly; geometry on a 64px grid.
  -->
  <rect width="64" height="64" rx="15" fill="#4F46E5"/>

  <!-- threshold: extends past both legs so it reads as a target line -->
  <path d="M12 37h40" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"
        stroke-linecap="round"/>

  <!-- the A, clearing it -->
  <path d="M17 49 L32 15 L47 49" stroke="#FFFFFF" stroke-width="7.5"
        stroke-linejoin="round" stroke-linecap="round" fill="none"/>
</svg>
